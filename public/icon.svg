  <!-- heart centered: inner viewBox tightened to the heart's real bounds (x8..92, y4..82) -->
  <svg x="96" y="107" width="320" height="298" viewBox="8 4 84 78" preserveAspectRatio="xMidYMid meet">
    <g clip-path="url(#heart)">
      <rect x="0" y="0" width="50" height="90" fill="#E86A5C"/>
      <rect x="50" y="0" width="50" height="90" fill="#2E9E9A"/>
    </g>
    <path d="M50 82 C20 55 8 38 8 25 C8 10 22 4 34 8 C42 11 48 18 50 24 C52 18 58 11 66 8 C78 4 92 10 92 25 C92 38 80 55 50 82 Z"
      fill="none" stroke="#33283A" stroke-width="3.2" stroke-linejoin="round" opacity="0.9"/>
  </svg>
</svg>
