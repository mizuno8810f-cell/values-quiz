name: Deploy to GitHub Pages

# GitHub Pages で公開する場合のワークフロー。
# 使い方:
#   1. GitHub リポジトリの Settings → Pages → Build and deployment の
#      "Source" を "GitHub Actions" に設定する
#   2. main ブランチに push するか、Actions タブから手動実行する
# Vercel / Netlify で公開する場合はこのワークフローは不要です（無視されます）。

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # base をリポジトリ名（例: /values-quiz/）に自動設定してビルド
      - run: VITE_BASE="/${GITHUB_REPOSITORY#*/}/" npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
